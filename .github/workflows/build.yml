name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Test package verifier against cross-platform fixtures
        run: node --test scripts/verify-packaged-sidecar.test.mjs
      - run: npm run sidecar:prepare
      - name: Verify Linux sidecar
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          test ! -e src-tauri/sidecar/${{ matrix.target }}/libcoreclrtraceptprovider.so
          src-tauri/sidecar/${{ matrix.target }}/BililiveRecorder.Cli --version
      - name: Sidecar lifecycle regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        with:
          args: -vv --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Smoke-test CLI executable extracted from the built desktop package
        timeout-minutes: 12
        run: npm run bundle:smoke
