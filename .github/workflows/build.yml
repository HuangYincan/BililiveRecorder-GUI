name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xauth xvfb
      - run: npm ci
      - name: Verify official white-background branding and stable update identity
        run: npm run brand:verify
      - run: npm run desktop:version-test
      - name: Test package verifier against cross-platform fixtures
        run: node --test scripts/verify-packaged-sidecar.test.mjs
      - run: npm run sidecar:prepare
      - name: Verify Linux sidecar
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          test ! -e src-tauri/sidecar/${{ matrix.target }}/libcoreclrtraceptprovider.so
          src-tauri/sidecar/${{ matrix.target }}/BililiveRecorder.Cli --version
      - name: Sidecar lifecycle regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform != 'ubuntu-22.04'
        with:
          args: -vv --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # Tauri derives Debian Package from productName; Unicode is invalid in
      # Debian's Package field. Keep its old ASCII identity for DEB only, but
      # emit the requested desktop Name from the pinned template. AppImage uses
      # the real (Unicode) productName and must be built separately.
      - name: Build stable-identity DEB with branded desktop entry
        if: matrix.platform == 'ubuntu-22.04'
        run: >-
          npm run tauri build -- -vv --target ${{ matrix.target }} --bundles deb
          --config '{"productName":"BililiveRecorder GUI","bundle":{"createUpdaterArtifacts":false,"linux":{"deb":{"desktopTemplate":"branding/linux.desktop"}}}}'
      - name: Build branded AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: >-
          npm run tauri build -- -vv --target ${{ matrix.target }} --bundles appimage
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Smoke-test CLI executable extracted from the built desktop package
        timeout-minutes: 12
        run: npm run bundle:smoke
      - name: Verify macOS bundle name and stable identifier
        if: startsWith(matrix.platform, 'macos-26')
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Mikufans录播姬.app"
          test -f "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = 'Mikufans录播姬'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'org.danmuji.bililiverecorder-gui'
      - name: Verify Linux DEB desktop name and stable package identity
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -name '*_amd64.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'bililive-recorder-gui'
          mkdir -p "$RUNNER_TEMP/brand-check"
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/brand-check"
          desktop=$(find "$RUNNER_TEMP/brand-check/usr/share/applications" -name '*.desktop' -print -quit)
          test -n "$desktop"
          grep -Fx 'Name=Mikufans录播姬' "$desktop"
      - name: Verify Windows installers display name and legacy MSI UpgradeCode
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI missing' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi.FullName, 0)
          function Get-MsiProperty($property) {
            $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = '$property'")
            $view.Execute()
            $record = $view.Fetch()
            if (-not $record) { throw "Missing MSI property $property" }
            return $record.StringData(1)
          }
          if ((Get-MsiProperty 'ProductName') -ne 'Mikufans录播姬') { throw 'MSI product name mismatch' }
          if ((Get-MsiProperty 'UpgradeCode').Trim('{}').ToLowerInvariant() -ne '3a5e8872-ebd5-524f-9fe9-825771b0859b') {
            throw 'MSI UpgradeCode changed: old MSI updates would not be recognized'
          }
          $nsis = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' | Select-Object -First 1
          if (-not $nsis -or $nsis.VersionInfo.ProductName -ne 'Mikufans录播姬') { throw 'NSIS installer display name mismatch' }
      - name: Install DMG and verify artifact lifecycle
        if: startsWith(matrix.platform, 'macos-26')
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          test -n "$dmg"
          mountpoint="$RUNNER_TEMP/bililive-recorder-dmg"
          installed_app="$RUNNER_TEMP/Mikufans录播姬.app"
          mkdir -p "$mountpoint"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach "$mountpoint" || true' EXIT
          ditto "$mountpoint/Mikufans录播姬.app" "$installed_app"
          hdiutil detach "$mountpoint"
          trap - EXIT

          export BILILIVE_ARTIFACT_APP="$installed_app/Contents/MacOS/bililive-recorder-gui"
          export BILILIVE_ARTIFACT_OK=1
          # Upstream Serilog uses RollingInterval.Day: it inserts YYYYMMDD
          # before .txt; the unrolled configured base path never exists.
          export BILILIVE_ARTIFACT_CLI_LOG="$HOME/Library/Logs/org.danmuji.bililiverecorder-gui/bililive-recorder$(date +%Y%m%d).txt"
          export BILILIVE_ARTIFACT_EVIDENCE_DIR="$RUNNER_TEMP/artifact-lifecycle-evidence"
          mkdir -p "$BILILIVE_ARTIFACT_EVIDENCE_DIR" "$(dirname "$BILILIVE_ARTIFACT_CLI_LOG")"
          printf 'BILILIVE_ARTIFACT_EVIDENCE_DIR=%s\n' "$BILILIVE_ARTIFACT_EVIDENCE_DIR" >> "$GITHUB_ENV"

          rm -f "$BILILIVE_ARTIFACT_CLI_LOG"
          cargo test --manifest-path src-tauri/Cargo.toml --test artifact_lifecycle quitting_the_app_stops_the_backend -- --ignored --exact --nocapture 2>&1 | tee "$BILILIVE_ARTIFACT_EVIDENCE_DIR/quit-test.log"
          test -s "$BILILIVE_ARTIFACT_CLI_LOG"
          grep -Eq 'Shutdown in progress|Dispose called' "$BILILIVE_ARTIFACT_CLI_LOG"
          cp "$BILILIVE_ARTIFACT_CLI_LOG" "$BILILIVE_ARTIFACT_EVIDENCE_DIR/quit-cli.log"

          rm -f "$BILILIVE_ARTIFACT_CLI_LOG"
          cargo test --manifest-path src-tauri/Cargo.toml --test artifact_lifecycle killing_the_app_stops_the_backend -- --ignored --exact --nocapture 2>&1 | tee "$BILILIVE_ARTIFACT_EVIDENCE_DIR/kill-test.log"
          test -s "$BILILIVE_ARTIFACT_CLI_LOG"
          cp "$BILILIVE_ARTIFACT_CLI_LOG" "$BILILIVE_ARTIFACT_EVIDENCE_DIR/kill-cli.log"
      - name: Install DEB and verify artifact lifecycle
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -name '*_amd64.deb' ! -name '*.sig' -print -quit)
          test -n "$deb"
          sudo dpkg -i "$deb"
          trap 'sudo dpkg -r bililive-recorder-gui || true' EXIT

          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          export BILILIVE_ARTIFACT_APP=/usr/bin/bililive-recorder-gui
          export BILILIVE_ARTIFACT_OK=1
          # Upstream Serilog uses RollingInterval.Day: it inserts YYYYMMDD
          # before .txt; the unrolled configured base path never exists.
          export BILILIVE_ARTIFACT_CLI_LOG="$XDG_DATA_HOME/org.danmuji.bililiverecorder-gui/logs/bililive-recorder$(date +%Y%m%d).txt"
          export BILILIVE_ARTIFACT_EVIDENCE_DIR="$RUNNER_TEMP/artifact-lifecycle-evidence"
          mkdir -p "$BILILIVE_ARTIFACT_EVIDENCE_DIR" "$(dirname "$BILILIVE_ARTIFACT_CLI_LOG")"
          printf 'BILILIVE_ARTIFACT_EVIDENCE_DIR=%s\n' "$BILILIVE_ARTIFACT_EVIDENCE_DIR" >> "$GITHUB_ENV"

          test -x "$BILILIVE_ARTIFACT_APP"
          rm -f "$BILILIVE_ARTIFACT_CLI_LOG"
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --test artifact_lifecycle quitting_the_app_stops_the_backend -- --ignored --exact --nocapture 2>&1 | tee "$BILILIVE_ARTIFACT_EVIDENCE_DIR/quit-test.log"
          test -s "$BILILIVE_ARTIFACT_CLI_LOG"
          grep -Eq 'Shutdown in progress|Dispose called' "$BILILIVE_ARTIFACT_CLI_LOG"
          cp "$BILILIVE_ARTIFACT_CLI_LOG" "$BILILIVE_ARTIFACT_EVIDENCE_DIR/quit-cli.log"

          rm -f "$BILILIVE_ARTIFACT_CLI_LOG"
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --test artifact_lifecycle killing_the_app_stops_the_backend -- --ignored --exact --nocapture 2>&1 | tee "$BILILIVE_ARTIFACT_EVIDENCE_DIR/kill-test.log"
          test -s "$BILILIVE_ARTIFACT_CLI_LOG"
          cp "$BILILIVE_ARTIFACT_CLI_LOG" "$BILILIVE_ARTIFACT_EVIDENCE_DIR/kill-cli.log"
      - name: Verify old NSIS installation updates in place on disposable runner
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $oldAssetDir = Join-Path $env:RUNNER_TEMP 'old-nsis'
          $installDir = Join-Path $env:RUNNER_TEMP 'branding-upgrade-fixture'
          New-Item -ItemType Directory -Force -Path $oldAssetDir | Out-Null
          gh release download app-v2.20.1 --pattern 'BililiveRecorder.GUI_2.20.1_x64-setup.exe' --dir $oldAssetDir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot obtain the previously published installer' }
          $oldInstaller = Get-ChildItem $oldAssetDir -Filter '*.exe' | Select-Object -First 1
          $newInstaller = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' | Select-Object -First 1
          if (-not $oldInstaller -or -not $newInstaller) { throw 'Old or new NSIS installer not found' }
          $oldRegistry = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BililiveRecorder GUI',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BililiveRecorder GUI'
          )
          try {
            $previous = Start-Process -FilePath $oldInstaller.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
            if ($previous.ExitCode -ne 0) { throw "Old NSIS install failed: $($previous.ExitCode)" }
            $found = @($oldRegistry | Where-Object { Test-Path -LiteralPath $_ })
            if ($found.Count -ne 1) { throw "Expected one old NSIS uninstall key, found $($found.Count)" }
            $oldKey = Get-ItemProperty -LiteralPath $found[0]
            if ($oldKey.DisplayName -ne 'BililiveRecorder GUI') { throw 'Old installer identity not observed' }
            $next = Start-Process -FilePath $newInstaller.FullName -ArgumentList @('/S', '/UPDATE', "/D=$installDir") -Wait -PassThru
            if ($next.ExitCode -ne 0) { throw "Branded NSIS update failed: $($next.ExitCode)" }
            $updated = Get-ItemProperty -LiteralPath $found[0]
            if ($updated.DisplayName -ne 'Mikufans录播姬') { throw 'Old install did not adopt the new display name' }
            if ((Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Mikufans录播姬') -or
                (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Mikufans录播姬')) {
              throw 'A side-by-side NSIS uninstall key was created'
            }
            $installedBinary = Join-Path $installDir 'bililive-recorder-gui.exe'
            $builtBinary = "src-tauri/target/${{ matrix.target }}/release/bililive-recorder-gui.exe"
            if (-not (Test-Path $installedBinary) -or (Get-FileHash $installedBinary).Hash -ne (Get-FileHash $builtBinary).Hash) {
              throw 'Old install path was not replaced with this build'
            }
            Write-Output "Old NSIS identity retained and updated in place: $($found[0])"
          } finally {
            $uninstaller = Join-Path $installDir 'uninstall.exe'
            if (Test-Path $uninstaller) {
              $cleanup = Start-Process -FilePath $uninstaller -ArgumentList @('/S', '/UPDATE') -Wait -PassThru
              if ($cleanup.ExitCode -ne 0) { Write-Warning "Fixture uninstall failed: $($cleanup.ExitCode)" }
            }
          }
      - name: Install MSI and verify artifact lifecycle
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI bundle not found' }

          $installDir = Join-Path $env:RUNNER_TEMP 'BililiveRecorder-GUI-installed'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'artifact-lifecycle-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          "BILILIVE_ARTIFACT_EVIDENCE_DIR=$evidenceDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $installLog = Join-Path $evidenceDir 'msi-install.log'
          # msiexec.exe is a GUI-subsystem launcher; invoking it with & can leave
          # $LASTEXITCODE unset. Start-Process -Wait -PassThru supplies a real
          # completion result instead of treating $null as an install failure.
          $installArgs = @('/i', ('"{0}"' -f $msi.FullName), '/qn', '/norestart', ('INSTALLDIR="{0}"' -f $installDir), '/L*v', ('"{0}"' -f $installLog))
          $installation = Start-Process -FilePath msiexec.exe -ArgumentList $installArgs -Wait -PassThru
          if ($null -eq $installation -or $null -eq $installation.ExitCode -or $installation.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 60 }
            throw "MSI installation did not succeed (exit=$($installation.ExitCode)); see uploaded msi-install.log"
          }

          try {
            $app = Get-ChildItem $installDir -Recurse -File -Filter 'bililive-recorder-gui.exe' | Select-Object -First 1
            if (-not $app) { throw "Installed app not found under $installDir" }

            $env:BILILIVE_ARTIFACT_APP = $app.FullName
            $env:BILILIVE_ARTIFACT_OK = '1'
            # Upstream Serilog inserts YYYYMMDD before .txt (daily rolling).
            $env:BILILIVE_ARTIFACT_CLI_LOG = Join-Path $env:LOCALAPPDATA ('org.danmuji.bililiverecorder-gui/logs/bililive-recorder{0}.txt' -f (Get-Date -Format yyyyMMdd))
            $env:BILILIVE_ARTIFACT_EVIDENCE_DIR = $evidenceDir
            New-Item -ItemType Directory -Force -Path $env:BILILIVE_ARTIFACT_EVIDENCE_DIR | Out-Null
            New-Item -ItemType Directory -Force -Path (Split-Path $env:BILILIVE_ARTIFACT_CLI_LOG) | Out-Null

            Remove-Item $env:BILILIVE_ARTIFACT_CLI_LOG -Force -ErrorAction SilentlyContinue
            cargo test --manifest-path src-tauri/Cargo.toml --test artifact_lifecycle quitting_the_app_stops_the_backend -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath (Join-Path $env:BILILIVE_ARTIFACT_EVIDENCE_DIR 'quit-test.log')
            $quitExitCode = $LASTEXITCODE
            if (Test-Path $env:BILILIVE_ARTIFACT_CLI_LOG -PathType Leaf) {
              Copy-Item $env:BILILIVE_ARTIFACT_CLI_LOG (Join-Path $env:BILILIVE_ARTIFACT_EVIDENCE_DIR 'quit-cli.log')
            } else {
              'UNPROVEN: Windows has no graceful console-control shutdown path, so a flushed CLI log is not required.' | Out-File (Join-Path $env:BILILIVE_ARTIFACT_EVIDENCE_DIR 'quit-flush-unproven.txt')
            }

            Remove-Item $env:BILILIVE_ARTIFACT_CLI_LOG -Force -ErrorAction SilentlyContinue
            cargo test --manifest-path src-tauri/Cargo.toml --test artifact_lifecycle killing_the_app_stops_the_backend -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath (Join-Path $env:BILILIVE_ARTIFACT_EVIDENCE_DIR 'kill-test.log')
            $killExitCode = $LASTEXITCODE
            if (Test-Path $env:BILILIVE_ARTIFACT_CLI_LOG -PathType Leaf) {
              Copy-Item $env:BILILIVE_ARTIFACT_CLI_LOG (Join-Path $env:BILILIVE_ARTIFACT_EVIDENCE_DIR 'kill-cli.log')
            } else {
              'UNPROVEN: forced termination does not promise recording flush.' | Out-File (Join-Path $env:BILILIVE_ARTIFACT_EVIDENCE_DIR 'kill-flush-unproven.txt')
            }
            # These are distinct verdicts. A quit driver failure must not skip
            # the separate forced-kill case, but neither failure can turn green.
            if ($quitExitCode -ne 0 -or $killExitCode -ne 0) {
              throw "Artifact lifecycle verdicts: normal quit=$quitExitCode, forced kill=$killExitCode; see uploaded test logs"
            }
          }
          finally {
            $uninstallArgs = @('/x', ('"{0}"' -f $msi.FullName), '/qn', '/norestart')
            $uninstall = Start-Process -FilePath msiexec.exe -ArgumentList $uninstallArgs -Wait -PassThru
            if ($null -eq $uninstall -or $uninstall.ExitCode -ne 0) {
              Write-Warning "MSI cleanup returned $($uninstall.ExitCode) on this disposable runner"
            }
          }
      - name: Upload artifact lifecycle evidence
        id: upload_lifecycle_evidence
        if: always() && env.BILILIVE_ARTIFACT_EVIDENCE_DIR != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: artifact-lifecycle-${{ matrix.target }}
          path: ${{ env.BILILIVE_ARTIFACT_EVIDENCE_DIR }}
          if-no-files-found: error
      # GitHub's artifact API occasionally times out on CreateArtifact even
      # after both real-app tests pass. Retry once, including ambiguous partial
      # creates; a second failure still fails the job rather than hiding loss
      # of the only per-run process/log evidence.
      - name: Retry artifact lifecycle evidence upload
        if: always() && steps.upload_lifecycle_evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-lifecycle-${{ matrix.target }}
          path: ${{ env.BILILIVE_ARTIFACT_EVIDENCE_DIR }}
          if-no-files-found: error
          overwrite: true
