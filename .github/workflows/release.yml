name: Release synced desktop app

on:
  push:
    branches: [main]
    paths:
      - upstream.json
  workflow_dispatch:
    inputs:
      source_pr:
        description: "Upstream sync PR that requested this release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm run sidecar:prepare
      - name: Verify Linux sidecar
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          test ! -e src-tauri/sidecar/${{ matrix.target }}/libcoreclrtraceptprovider.so
          src-tauri/sidecar/${{ matrix.target }}/BililiveRecorder.Cli --version
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "BililiveRecorder GUI v__VERSION__"
          releaseBody: |
            This release bundles the matching official BililiveRecorder CLI and its embedded upstream WebUI.

            Upstream release metadata is recorded in `upstream.json`.
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: -vv --target ${{ matrix.target }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate updater assets and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir release-audit
          gh release download "app-v${VERSION}" --pattern latest.json --dir release-audit
          gh release view "app-v${VERSION}" --json assets > release-audit/assets.json
          npm run release:validate -- release-audit/latest.json release-audit/assets.json
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "app-v${VERSION}" --draft=false --latest
      - name: Verify public updater endpoint
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ENDPOINT="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 "$ENDPOINT" -o public-latest.json
          test "$(node -p "require('./public-latest.json').version")" = "$VERSION"
          node - <<'NODE'
          const manifest = require('./public-latest.json');
          for (const platform of ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64']) {
            if (!manifest.platforms?.[platform]?.url) throw new Error(`Missing public ${platform} updater`);
          }
          NODE
