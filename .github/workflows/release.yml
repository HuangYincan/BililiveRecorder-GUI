name: Release synced desktop app

# No push trigger: a code-only merge must never rebuild or overwrite an old
# signed release. Upstream sync dispatches the newly merged SHA explicitly.
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Reviewed main commit to release (must match HEAD of main)"
        required: true
        type: string
      source_pr:
        description: "Upstream sync PR that requested this release"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require approved main and a new immutable tag and updater version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Updater minisign keys are NOT Apple Developer ID credentials.
          # Refuse to create even a draft if the Apple notarization prerequisites
          # have not been provisioned as repository Actions secrets.
          for value in "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY" "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"; do
            if [ -z "$value" ]; then
              echo "Apple Developer ID signing/notarization credentials are missing; release stopped before build" >&2
              exit 1
            fi
          done
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release must target main" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo "Approval SHA does not match main's checked-out commit" >&2
            exit 1
          fi
          MAIN_SHA=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "main advanced since this release was approved; review its new SHA" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          TAG="app-v${VERSION}"
          # Do not silently overwrite the old release even if no release
          # object is visible yet (a draft or a leftover tag is enough).
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Release tag ${TAG} already exists; bump the desktop version first" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite assets" >&2
            exit 1
          fi
          # This repository already has a published updater release; a failed
          # lookup is an error, not permission to publish an unverified tag.
          LATEST=$(gh release view --json tagName --jq '.tagName')
          if [ -n "$LATEST" ]; then
            CURRENT_VERSION="$VERSION" LATEST_VERSION="${LATEST#app-v}" node --input-type=module -e '
              import { compareVersions } from "./scripts/desktop-version.mjs";
              if (compareVersions(process.env.CURRENT_VERSION, process.env.LATEST_VERSION) <= 0)
                throw new Error("Desktop version must be newer than the public latest release");
            '
          fi

  release:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Verify official white-background branding and stable update identity
        run: npm run brand:verify
      - name: Verify builder checkout is the approved commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm run sidecar:prepare
      # Tauri's bundle signature does not prove the .NET native resources are
      # Developer ID signed. Import the same certificate before bundling and
      # sign ALL native sidecar executables and dylibs on this disposable runner.
      - name: Import Developer ID Application certificate
        if: startsWith(matrix.platform, 'macos-26')
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Sign native sidecar files before bundling
        if: startsWith(matrix.platform, 'macos-26')
        shell: bash
        run: bash scripts/sign-macos-sidecar.sh "src-tauri/sidecar/${TAURI_TARGET_TRIPLE}" "$APPLE_SIGNING_IDENTITY" "$APPLE_TEAM_ID"
      - name: Verify Linux sidecar
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          test ! -e src-tauri/sidecar/${{ matrix.target }}/libcoreclrtraceptprovider.so
          src-tauri/sidecar/${{ matrix.target }}/BililiveRecorder.Cli --version
      # Fixed upstream action: getAssetName uses [version]/[platform]/[arch]/[setup]/[ext].
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        if: matrix.platform != 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Mikufans录播姬 v__VERSION__"
          releaseBody: |
            This release bundles the matching official BililiveRecorder CLI and its embedded upstream WebUI.

            Upstream release metadata is recorded in `upstream.json`.
          releaseDraft: true
          prerelease: false
          assetNamePattern: MikufansRecorder_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 3
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: -vv --target ${{ matrix.target }}

      - name: Publish stable-identity DEB and RPM to draft release
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Mikufans录播姬 v__VERSION__"
          releaseBody: |
            This release bundles the matching official BililiveRecorder CLI and its embedded upstream WebUI.

            Upstream release metadata is recorded in `upstream.json`.
          releaseDraft: true
          prerelease: false
          assetNamePattern: MikufansRecorder_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 3
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: >-
            -vv --target ${{ matrix.target }} --bundles deb,rpm
            --config '{"productName":"BililiveRecorder GUI","bundle":{"linux":{"deb":{"desktopTemplate":"branding/linux.desktop"},"rpm":{"desktopTemplate":"branding/linux.desktop"}}}}'

      - name: Publish branded AppImage to the same draft release
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Mikufans录播姬 v__VERSION__"
          releaseBody: |
            This release bundles the matching official BililiveRecorder CLI and its embedded upstream WebUI.

            Upstream release metadata is recorded in `upstream.json`.
          releaseDraft: true
          prerelease: false
          assetNamePattern: MikufansRecorder_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 3
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: -vv --target ${{ matrix.target }} --bundles appimage

      - name: Reject public release if downloaded macOS DMG fails Gatekeeper
        if: startsWith(matrix.platform, 'macos-26')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          case "$TAURI_TARGET_TRIPLE" in
            aarch64-apple-darwin) arch=aarch64 ;;
            x86_64-apple-darwin) arch=x64 ;;
            *) exit 1 ;;
          esac
          name="MikufansRecorder_${version}_darwin_${arch}.dmg"
          mkdir -p macos-release-audit
          gh release view "app-v${version}" --json assets > macos-release-audit/assets.json
          NAME="$name" node -e '
            const fs = require("node:fs");
            const matches = JSON.parse(fs.readFileSync("macos-release-audit/assets.json")).assets.filter(a => a.name === process.env.NAME);
            if (matches.length !== 1 || !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest || "")) process.exit(1);
            fs.writeFileSync("macos-release-audit/expected.sha", matches[0].digest.slice(7));
          '
          gh release download "app-v${version}" --pattern "$name" --dir macos-release-audit
          test "$(shasum -a 256 "macos-release-audit/$name" | cut -d' ' -f1)" = "$(cat macos-release-audit/expected.sha)"
          bash scripts/verify-macos-release-dmg.sh "macos-release-audit/$name" "$TAURI_TARGET_TRIPLE"
      - name: Verify macOS bundle name and stable identifier
        if: startsWith(matrix.platform, 'macos-26')
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Mikufans录播姬.app"
          test -f "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = 'Mikufans录播姬'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'org.danmuji.bililiverecorder-gui'
      - name: Verify Linux DEB desktop name and stable package identity
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -name '*_amd64.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'bililive-recorder-gui'
          mkdir -p "$RUNNER_TEMP/brand-check"
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/brand-check"
          desktop=$(find "$RUNNER_TEMP/brand-check/usr/share/applications" -name '*.desktop' -print -quit)
          test -n "$desktop"
          grep -Fx 'Name=Mikufans录播姬' "$desktop"
          rpm=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/rpm" -name '*.rpm' -print -quit)
          test -n "$rpm"
          test "$(rpm -qp --qf '%{NAME}' "$rpm")" = 'bililive-recorder-gui'
          test "$(rpm -qp --qf '%{SUMMARY}' "$rpm")" = 'Mikufans录播姬跨平台桌面端'
      - name: Verify Windows installers display name and legacy MSI UpgradeCode
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI missing' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi.FullName, 0)
          function Get-MsiProperty($property) {
            $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = '$property'")
            $view.Execute()
            $record = $view.Fetch()
            if (-not $record) { throw "Missing MSI property $property" }
            return $record.StringData(1)
          }
          if ((Get-MsiProperty 'ProductName') -ne 'Mikufans录播姬') { throw 'MSI product name mismatch' }
          # WiX Product/@UpgradeCode is indexed in the MSI Upgrade table, not
          # guaranteed to exist as a Property row. Query the actual upgrade
          # relation; otherwise a null Property read falsely fails the build.
          $upgradeView = $database.OpenView('SELECT `UpgradeCode` FROM `Upgrade`')
          $upgradeView.Execute()
          $upgradeCodes = @()
          while ($row = $upgradeView.Fetch()) { $upgradeCodes += $row.StringData(1) }
          if (-not ($upgradeCodes | Where-Object { $_.Trim('{}').ToLowerInvariant() -eq '3a5e8872-ebd5-524f-9fe9-825771b0859b' })) {
            throw "Old MSI UpgradeCode absent from Upgrade table: $($upgradeCodes -join ', ')"
          }
          $nsis = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' | Select-Object -First 1
          if (-not $nsis -or $nsis.VersionInfo.ProductName -ne 'Mikufans录播姬') { throw 'NSIS installer display name mismatch' }

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test missing-tag creation and identity rejection without publishing
        run: node --test scripts/ensure-release-tag.test.mjs
      # Read the actual GitHub draft AFTER upload (not generated test names),
      # before creating a ref or making any release public. Missing, colliding,
      # normalized or unexpectedly named assets fail closed.
      - name: Verify actual uploaded ASCII asset names and build identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-audit
          gh release view "app-v${VERSION}" --json tagName,isDraft,targetCommitish,assets > release-audit/draft.json
          node scripts/verify-uploaded-release-assets.mjs release-audit/draft.json "$VERSION" "$GITHUB_SHA"
      - name: Establish new tag and verify it resolves to the actual build commit
        run: bash scripts/ensure-release-tag.sh
      - name: Validate updater assets and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-audit/signatures
          gh release view "app-v${VERSION}" --json assets > release-audit/assets.json
          gh release download "app-v${VERSION}" --pattern '*.sig' --dir release-audit/signatures
          npm run release:manifest -- release-audit/assets.json release-audit/signatures release-audit/latest.json
          gh release upload "app-v${VERSION}" release-audit/latest.json --clobber
          npm run release:validate -- release-audit/latest.json release-audit/assets.json release-audit/signatures
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "app-v${VERSION}" --draft=false --latest
      - name: Verify public updater endpoint
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ENDPOINT="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 "$ENDPOINT" -o public-latest.json
          test "$(node -p "require('./public-latest.json').version")" = "$VERSION"
          node - <<'NODE'
          const manifest = require('./public-latest.json');
          for (const platform of ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64']) {
            if (!manifest.platforms?.[platform]?.url) throw new Error(`Missing public ${platform} updater`);
          }
          NODE
