[package]
name = "bililive-recorder-gui"
version = "2.20.1"
description = "Cross-platform Tauri desktop launcher for BililiveRecorder"
authors = ["HuangYincan"]
license = "GPL-3.0-only"
repository = "https://github.com/huangyincan/BililiveRecorder-GUI"
edition = "2024"

[lib]
name = "bililive_recorder_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-updater = "2.9.0"
tokio = { version = "1", features = ["time"] }
url = "2"

# The backend is tied to the guardian's lifetime by a job object, so that a
# guardian killed outright still takes the backend with it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
